    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

        body {
            background-color: #1a0f0a;

            font-family: 'IM Fell English', serif;

        .medieval-font { font-family: 'MedievalSharp', cursive; }
        .cinzel { font-family: 'Cinzel', serif; }
        .parchment {
            background-color: #f4e4bc;
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');

            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .gold-border { border: 2px solid #c5a059; }
        .dark-red-bg { background-color: #5a0a0a; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #2d1b0f; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #8b6b40; border-radius: 4px; }
